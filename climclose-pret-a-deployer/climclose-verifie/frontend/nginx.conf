server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
